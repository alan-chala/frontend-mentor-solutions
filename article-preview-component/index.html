<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Article preview component for Frontend Mentor"
    />
    <meta
      name="keywords"
      content="article, preview, component, frontend, mentor"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <title>Frontend Mentor | Article preview component</title>
  </head>
  <body>
    <main>
      <article class="card">
        <div class="card-image">
          <img src="./assets/images/drawers.jpg" alt="Drawers image" />
        </div>

        <div class="card-text">
          <h1>
            Shift the overall look and feel by adding these wonderful touches to
            furniture in your home
          </h1>
          <p>
            Ever been in a room and felt like something was missing? Perhaps it
            felt slightly bare and uninviting. I’ve got some simple tips to help
            you make any room feel complete.
          </p>
        </div>

        <footer class="footer">
          <div class="profile">
            <img
              src="./assets/images/avatar-michelle.jpg"
              alt="Michelle Appleton"
              width="50"
              height="50"
            />
            <p>Michelle Appleton <br /><span>28 Jun 2020</span></p>
          </div>

          <div>
            <button>
              <img
                src="./assets/images/icon-share.svg"
                alt="Share icon"
                width="24"
                height="24"
              />
            </button>
          </div>
        </footer>
      </article>
    </main>
  </body>
</html>
