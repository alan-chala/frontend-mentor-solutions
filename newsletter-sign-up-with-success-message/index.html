<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="./assets/css/styles.css" />
    <title>
      Frontend Mentor | Newsletter sign-up form with success message
    </title>
  </head>
  <body>
    <main>
      <section>
        <div class="text-wrapper">
          <h1>Stay updated!</h1>
          <p>Join 60,000+ product managers receiving monthly updates on:</p>
          <ul>
            <li>Product discovery and building what matters</li>
            <li>Measuring to ensure updates are a success</li>
            <li>And much more!</li>
          </ul>

          <form novalidate>
            <label for="email">Email address <span class="error-message">Valid email required</span></label>
              <input
                type="email"
                name="email"
                id="email"
                placeholder="email@company.com"
              />
            <button type="submit">Subscribe to monthly newsletter</button>
          </form>
        </div>

        <div class="image-wrapper">
          <picture>
            <source
              media="(max-width: 479px)"
              srcset="./assets/images/illustration-sign-up-mobile.svg"
            />
            <source
              media="(max-width: 780px)"
              srcset="./assets/images/illustration-sign-up-tablet.svg"
            />
            <img
              src="./assets/images/illustration-sign-up-desktop.svg"
              alt="Person sitting at a desk with a laptop"
            />
          </picture>
        </div>
      </section>
    </main>

    <!-- 
  
    Success message start 

    Thanks for subscribing!

    A confirmation email has been sent to ash@loremcompany.com. 
    Please open it and click the button inside to confirm your subscription.

    Dismiss message
   
  -->
    <script src="./assets/js/index.js"></script>
  </body>
</html>
