<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A simple profile card with social media links, created as a solution to the Frontend Mentor challenge."
    />
    <meta
      name="keywords"
      content="profile card, social media links, frontend mentor, HTML, CSS"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="./assets/css/styles.css" />
    <title>Frontend Mentor | Social links profile</title>
  </head>
  <body>
    <main>
      <article class="card">
        <div>
          <img
            src="./assets/images/avatar-jessica.jpeg"
            width="100"
            height="100"
            alt="Jessica Randall's profile picture"
          />
        </div>

        <div class="card-text">
          <h1>Jessica Randall</h1>
          <p class="location">London, United Kingdom</p>
        </div>

        <div>
          <p class="bio">"Front-end developer and avid reader."</p>
        </div>

        <div class="social-media">
          <ul>
            <li><a href="#" target="_blank">GitHub</a></li>
            <li><a href="#" target="_blank">Frontend Mentor</a></li>
            <li><a href="#" target="_blank">LinkedIn</a></li>
            <li><a href="#" target="_blank">Twitter</a></li>
            <li><a href="#" target="_blank">Instagram</a></li>
          </ul>
        </div>
      </article>
    </main>
  </body>
</html>
