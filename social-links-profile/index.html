<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A simple profile card with social media links, created as a solution to the Frontend Mentor challenge."
    />
    <meta
      name="keywords"
      content="profile card, social media links, frontend mentor, HTML, CSS"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="./assets/css/styles.css" />
    <title>Frontend Mentor | Social links profile</title>
  </head>
  <body>
    <main class="page">
      <article class="card" aria-labelledby="profile-name">
        <figure class="card__avatar">
          <img
            src="./assets/images/avatar-jessica.jpeg"
            width="100"
            height="100"
            alt="Jessica Randall's profile picture"
          />
        </figure>

        <header class="card__header">
          <h1 id="profile-name" class="card__name">Jessica Randall</h1>
          <p class="card__location">London, United Kingdom</p>
        </header>

        <p class="card__bio">"Front-end developer and avid reader."</p>

        <nav class="card__social" aria-label="Social links">
          <ul class="social-list">
            <li class="social-list__item">
              <a class="social-list__link" href="#" target="_blank" rel="noopener">
                GitHub
              </a>
            </li>
            <li class="social-list__item">
              <a class="social-list__link" href="#" target="_blank" rel="noopener">
                Frontend Mentor
              </a>
            </li>
            <li class="social-list__item">
              <a class="social-list__link" href="#" target="_blank" rel="noopener">
                LinkedIn
              </a>
            </li>
            <li class="social-list__item">
              <a class="social-list__link" href="#" target="_blank" rel="noopener">
                Twitter
              </a>
            </li>
            <li class="social-list__item">
              <a class="social-list__link" href="#" target="_blank" rel="noopener">
                Instagram
              </a>
            </li>
          </ul>
        </nav>
      </article>
    </main>
  </body>
</html>
